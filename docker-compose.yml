name: local-seo-audit

# Logs are capped (3 files x 10 MB per container) so they never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: local-seo-audit:dev
  logging: *logging
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://seo:${POSTGRES_PASSWORD}@postgres:5432/seo
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      # In-house app without login: only reachable from the server itself (default). Use an SSH tunnel
      # to open it from your computer; set APP_BIND=0.0.0.0 only behind a firewall/VPN.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    # -B: also runs the schedule (nightly 30-day clean-up, interrupted-job check every 30 min)
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-B", "-s", "/tmp/celerybeat-schedule",
              "--loglevel=info", "--concurrency=2"]

  postgres:
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
