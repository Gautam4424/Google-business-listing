<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Business Profile Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --border: rgba(255,255,255,0.1);
            --accent: #3b82f6;
            --accent2: #a78bfa;
            --muted: #94a3b8;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at top right, rgba(59,130,246,0.1), transparent 40%),
                radial-gradient(circle at bottom left, rgba(167,139,250,0.07), transparent 40%);
        }

        /* ── Header ── */
        header {
            padding: 3rem 2rem 1.5rem;
            text-align: center;
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.04em;
        }
        .subtitle { color: var(--muted); margin-top: 0.4rem; font-size: 1rem; }

        /* ── Search bar ── */
        .search-wrap {
            margin: 1.5rem auto 0;
            max-width: 640px;
            display: flex;
            gap: 10px;
        }
        .search-wrap input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(30,41,59,0.5);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap button {
            padding: 12px 22px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }
        .search-wrap button:hover { background: #2563eb; }
        .search-wrap button:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-top: 0.75rem; font-size: 0.88rem; color: var(--muted); min-height: 20px; }

        /* ── Grid ── */
        .grid {
            max-width: 1280px;
            margin: 2rem auto 4rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.75rem;
        }

        /* ── Card ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 22px 45px rgba(0,0,0,0.35); }

        .card-header {
            padding: 1.5rem 1.5rem 0;
        }
        .biz-name { font-size: 1.25rem; font-weight: 700; color: #fff; }
        .biz-category {
            display: inline-block;
            margin-top: 0.4rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(167,139,250,0.15);
            color: #a78bfa;
            border: 1px solid rgba(167,139,250,0.3);
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 0.75rem;
        }
        .stars { color: #fbbf24; font-size: 1rem; letter-spacing: 1px; }
        .rating-num { font-weight: 700; color: #fbbf24; }
        .review-cnt { font-size: 0.82rem; color: var(--muted); }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 1rem 1.5rem 0;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 6px 14px;
            border-radius: 8px 8px 0 0;
            border: none;
            background: none;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { background: rgba(59,130,246,0.15); color: var(--accent); border-bottom: 2px solid var(--accent); }

        .tab-content { display: none; padding: 1.25rem 1.5rem 1.5rem; }
        .tab-content.active { display: block; }

        /* ── Topic chips ── */
        .topics-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 0.5rem;
        }
        .topic-chip {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(59,130,246,0.12);
            color: #60a5fa;
            border: 1px solid rgba(59,130,246,0.25);
        }
        .topic-chip span {
            opacity: 0.7;
            font-weight: 400;
            margin-left: 4px;
        }

        /* ── Social Profiles ── */
        .social-wrap {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .about-section h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
        }

        /* ── Products ── */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            padding: 0.5rem 0;
        }
        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-3px); }
        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: rgba(255,255,255,0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.8rem;
        }
        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .product-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }
        .product-price {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
        }
        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }
        .social-item:hover { color: #fff; transform: translateY(-2px); }
        .social-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03);
            color: #fff;
        }
        .social-icon svg { width: 24px; height: 24px; }
        
        .social-item.facebook .social-icon { color: #1877F2; }
        .social-item.instagram .social-icon { color: #E4405F; }
        .social-item.linkedin .social-icon { color: #0A66C2; }
        .social-item.twitter .social-icon { color: #1DA1F2; }
        .social-item.youtube .social-icon { color: #FF0000; }
        .social-item.tiktok .social-icon { color: #fff; }

        /* ── Info rows ── */
        .info-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            font-size: 0.88rem;
        }
        .info-icon { width: 18px; height: 18px; flex-shrink: 0; color: var(--accent); margin-top: 1px; }
        .info-label { font-weight: 600; color: #cbd5e1; min-width: 80px; }
        .info-val { color: var(--muted); word-break: break-word; }
        .info-val a { color: var(--accent); text-decoration: none; }
        .info-val a:hover { text-decoration: underline; }

        /* ── Hours table ── */
        .hours-table { width: 100%; font-size: 0.84rem; border-collapse: collapse; }
        .hours-table td { padding: 3px 6px; color: var(--muted); }
        .hours-table td:first-child { font-weight: 600; color: #cbd5e1; width: 100px; }

        /* ── Reviews ── */
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .reviews-list::-webkit-scrollbar { width: 4px; }
        .reviews-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        .reviews-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        .review-item {
            background: rgba(0,0,0,0.2);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
        }
        .review-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .review-author { font-size: 0.78rem; font-weight: 700; color: #e2e8f0; }
        .review-stars { font-size: 0.72rem; color: #fbbf24; }
        .review-date { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
        .review-text { font-size: 0.82rem; color: var(--muted); line-height: 1.55; }

        /* ── Status chip ── */
        .hours-chip {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        .hours-chip.open { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .hours-chip.closed { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }

        /* ── Loader ── */
        .loader {
            grid-column: 1/-1;
            padding: 4rem;
            text-align: center;
            color: var(--muted);
            font-size: 1.1rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ── Empty state ── */
        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

<header>
    <h1>Google Business Profile</h1>
    <p class="subtitle">Scrape full business data from Google Maps</p>
    <div class="search-wrap">
        <input type="text" id="search-input" placeholder='e.g. "Swift Painting LLC Baton Rouge LA"' />
        <button id="search-btn">Search &amp; Scrape</button>
    </div>
    <div id="status" class="status"></div>
</header>

<div class="grid" id="grid">
    <div class="loader">Loading saved data...</div>
</div>

<script>
const grid      = document.getElementById('grid');
const input     = document.getElementById('search-input');
const btn       = document.getElementById('search-btn');
const status    = document.getElementById('status');

/* ── Helpers ── */
const starStr = n => '★'.repeat(n || 0) + '☆'.repeat(5 - (n || 0));

function ico(svgPath) {
    return `<svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${svgPath}"/>
    </svg>`;
}

const ICONS = {
    address: 'M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0zM15 11a3 3 0 11-6 0 3 3 0 016 0z',
    web:     'M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9',
    phone:   'M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498A1 1 0 0121 15v3a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z',
    clock:   'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z',
    code:    'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4',
    photo:   'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z',
    tag:     'M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z',
    facebook:'M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3.81l.39-4H14V7a1 1 0 011-1h3z',
    instagram:'M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zm1.5-4.87h.01M6.5 6.5h11A5 5 0 0122.5 11.5v11a5 5 0 01-5 5h-11a5 5 0 01-5-5v-11a5 5 0 015-5z',
    linkedin:'M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2zM4 2a2 2 0 110 4 2 2 0 010-4z',
    twitter: 'M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z',
    youtube: 'M22.54 6.42a2.78 2.78 0 00-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 00-1.94 2A29 29 0 001 11.75a29 29 0 00.46 5.33 2.78 2.78 0 001.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 001.94-2 29 29 0 00.46-5.33 29 29 0 00-.46-5.33zM9.75 15.02V8.48l5.75 3.27-5.75 3.27z',
    tiktok:  'M9 0h1.98c.144.715.54 1.617 1.235 2.512C12.895 3.389 13.797 4 15 4v2c-1.753 0-3.07-.814-4-1.829V11a5 5 0 1 1-5-5v2a3 3 0 1 0 3 3V0Z'
};

function buildCard(biz) {
    const isOpen = (biz.current_hours_status || '').toLowerCase().includes('open');
    const hoursChip = biz.current_hours_status && biz.current_hours_status !== 'N/A'
        ? `<div class="hours-chip ${isOpen ? 'open' : 'closed'}">${biz.current_hours_status}</div>`
        : '';

    // Weekly hours table
    const weeklyHtml = biz.weekly_hours && Object.keys(biz.weekly_hours).length > 0
        ? `<table class="hours-table">${Object.entries(biz.weekly_hours).map(([d,t]) =>
            `<tr><td>${d}</td><td>${t}</td></tr>`).join('')}</table>`
        : '<p style="color:var(--muted);font-size:0.85rem;">Hours not available</p>';

    // Profile tab
    const topicsHtml = (biz.review_topics && biz.review_topics.length > 0)
        ? `<div class="topics-wrap">${biz.review_topics.map(t =>
            `<span class="topic-chip">${t.topic}<span>${t.mentions}x</span></span>`
          ).join('')}</div>`
        : '<p style="color:var(--muted);font-size:0.85rem;">No topics found.</p>';

    let socialHtml = '';
    if (biz.social_profiles && Object.keys(biz.social_profiles).length > 0) {
        socialHtml = `<div class="social-wrap">`;
        for (const [platform, url] of Object.entries(biz.social_profiles)) {
            const iconKey = ICONS[platform] ? platform : 'web';
            const properName = platform.charAt(0).toUpperCase() + platform.slice(1);
            socialHtml += `
                <a href="${url}" target="_blank" class="social-item ${platform}">
                    <div class="social-icon">${ico(ICONS[iconKey])}</div>
                    <span>${properName}</span>
                </a>`;
        }
        socialHtml += `</div>`;
    }

    const profileHtml = `
        <div class="info-row">
            ${ico(ICONS.photo)}
            <div><span class="info-label">Photos</span><span class="info-val">${biz.photo_count || 'N/A'}</span></div>
        </div>
        ${socialHtml ? `
        <div style="margin-top:1.5rem;">
            <div style="font-size:0.95rem;font-weight:500;color:#fff;margin-bottom:0.5rem;">Profiles</div>
            ${socialHtml}
        </div>
        ` : ''}
        <div style="margin-top:1.5rem;">
            <div style="font-size:0.95rem;font-weight:500;color:#fff;margin-bottom:0.5rem;">Review Keywords</div>
            ${topicsHtml}
        </div>
    `;

    // About tab
    const aboutHtml = `
        ${hoursChip}
        <div class="info-row">${ico(ICONS.clock)}<div><span class="info-label">Hours</span>${weeklyHtml}</div></div>
        <div class="info-row">${ico(ICONS.address)}<div><span class="info-label">Address</span><span class="info-val">${biz.address || 'N/A'}</span></div></div>
        <div class="info-row">${ico(ICONS.web)}<div><span class="info-label">Website</span><span class="info-val">${biz.website && biz.website!=='N/A' ? `<a href="${biz.website}" target="_blank">${biz.website}</a>` : 'N/A'}</span></div></div>
        <div class="info-row">${ico(ICONS.phone)}<div><span class="info-label">Phone</span><span class="info-val">${biz.phone || 'N/A'}</span></div></div>
        <div class="info-row">${ico(ICONS.code)}<div><span class="info-label">Plus Code</span><span class="info-val">${biz.plus_code || 'N/A'}</span></div></div>
    `;

    // Products tab
    const productsHtml = (biz.products && biz.products.length > 0)
        ? `<div class="products-grid">${biz.products.map(p => `
            <div class="product-card">
                <div class="product-img">
                    ${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` : 'No Image'}
                </div>
                <div class="product-info">
                    <div class="product-name">${p.name || 'Product'}</div>
                    ${p.price ? `<div class="product-price">${p.price}</div>` : ''}
                </div>
            </div>
        `).join('')}</div>`
        : '<p style="color:var(--muted);font-size:0.85rem;">No products found.</p>';

    // Reviews tab
    const revList = (biz.reviews && biz.reviews.length > 0)
        ? biz.reviews.map(r => {
            if (typeof r === 'string') return `<div class="review-item"><div class="review-text">"${r}"</div></div>`;
            return `<div class="review-item">
                <div class="review-meta">
                    <span class="review-author">${r.reviewer || 'Anonymous'}</span>
                    <span class="review-stars">${starStr(r.stars)}</span>
                </div>
                <div class="review-date">${r.date || ''}</div>
                <div class="review-text">"${r.text}"</div>
            </div>`;
        }).join('')
        : '<p style="color:var(--muted);font-size:0.85rem;">No reviews found.</p>';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
        <div class="card-header">
            <div class="biz-name">${biz.name || 'Unknown'}</div>
            ${biz.category && biz.category !== 'N/A' ? `<span class="biz-category">${biz.category}</span>` : ''}
            <div class="rating-row">
                <span class="stars">${starStr(Math.round(biz.rating || 0))}</span>
                <span class="rating-num">${biz.rating || 0}</span>
                <span class="review-cnt">(${(biz.review_count || 0).toLocaleString()} reviews)</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="about">About</button>
            <button class="tab" data-tab="profile">Profile</button>
            <button class="tab" data-tab="products">Products (${(biz.products || []).length})</button>
            <button class="tab" data-tab="reviews">Reviews (${(biz.reviews || []).length})</button>
        </div>

        <div class="tab-content active" data-panel="about">${aboutHtml}</div>
        <div class="tab-content" data-panel="profile">${profileHtml}</div>
        <div class="tab-content" data-panel="products">${productsHtml}</div>
        <div class="tab-content" data-panel="reviews">
            <div class="reviews-list">${revList}</div>
        </div>
    `;

    // Tab switching
    card.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => {
            card.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            card.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            card.querySelector(`[data-panel="${t.dataset.tab}"]`).classList.add('active');
        });
    });

    return card;
}

function render(data) {
    grid.innerHTML = '';
    if (!data || data.length === 0) {
        grid.innerHTML = '<div class="empty">No results. Enter a search query above.</div>';
        return;
    }
    data.forEach(biz => grid.appendChild(buildCard(biz)));
}

/* ── Load saved data on page open ── */
(async () => {
    try {
        const r = await fetch('/api/data');
        render(await r.json());
    } catch {
        render([]);
    }
})();

/* ── Search handler ── */
btn.addEventListener('click', async () => {
    const q = input.value.trim();
    if (!q) return;
    btn.disabled = true;
    btn.textContent = 'Scraping...';
    status.textContent = 'Launching headless browser — this may take up to 2 minutes...';
    status.style.color = 'var(--accent)';
    grid.innerHTML = '<div class="loader">Scraping in progress...</div>';

    try {
        const res = await fetch('/api/scrape', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({query: q})
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();
        status.textContent = `Done! Showing ${result.new_results} result(s) for "${q}".`;
        status.style.color = '#10b981';
        render(result.data);
    } catch (e) {
        status.textContent = `Error: ${e.message}`;
        status.style.color = '#ef4444';
        grid.innerHTML = '<div class="empty">Scraping failed. Check console for details.</div>';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Search & Scrape';
    }
});
</script>
</body>
</html>
